<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="em-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="em-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="em-grad-cap" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="em-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Subtle Stroke -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#em-grad-primary)" filter="url(#em-shadow)" />
  <rect x="8" y="8" width="104" height="104" rx="26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Inner Soft Glow Aura -->
  <circle cx="60" cy="48" r="32" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Graduation Cap (Mortarboard Top Diamond) -->
  <path d="M60 28 L94 44 L60 60 L26 44 Z" fill="url(#em-grad-cap)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Cap Skull Base Arc -->
  <path d="M38 51.5 L38 64 C38 72 82 72 82 64 L82 51.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Golden Tassel & Hanging Cord -->
  <path d="M78 49 L88 56 L88 68" stroke="url(#em-grad-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="88" cy="70" r="2.5" fill="url(#em-grad-accent)" />

  <!-- Open Knowledge Book Pages at Base -->
  <!-- Left Page -->
  <path d="M32 75 C42 72 52 74 60 78 L60 93 C52 89 42 87 32 90 Z" fill="#FFFFFF" fill-opacity="0.95" />
  <!-- Right Page -->
  <path d="M88 75 C78 72 68 74 60 78 L60 93 C68 89 78 87 88 90 Z" fill="#FFFFFF" fill-opacity="0.88" />
  <!-- Spine Line -->
  <line x1="60" y1="78" x2="60" y2="94" stroke="#4338CA" stroke-width="2" stroke-linecap="round" />

  <!-- Small Spark of Innovation / Star on Top Right -->
  <path d="M92 24 Q92 28 96 28 Q92 28 92 32 Q92 28 88 28 Q92 28 92 24 Z" fill="url(#em-grad-accent)" />
</svg>
